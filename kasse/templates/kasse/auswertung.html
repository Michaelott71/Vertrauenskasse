{% extends "kasse/base.html" %}
{% block title %}Auswertung – Vertrauenskasse{% endblock %}
{% block content %}
  <h1>Auswertung</h1>
  <p class="muted"><a href="{% url 'kasse:monatsauswertung' %}">Zur Monatsauswertung</a></p>

  <div class="card">
    <form method="get">
      {{ form.as_p }}
      <button type="submit">Berechnen</button>
    </form>
  </div>

  {% if error %}
    <div class="card">
      <p class="negative">{{ error }}</p>
    </div>
  {% endif %}

  {% if result %}
    {% include "kasse/_auswertung_ergebnis.html" %}
  {% endif %}
{% endblock %}
